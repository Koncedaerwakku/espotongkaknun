<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - Es Potong Singapore Kak Nun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-red-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-red-700 text-white p-4 shadow-md text-center border-b-4 border-yellow-400">
        <h1 class="text-xl font-extrabold tracking-wider">🔒 PANEL KASIR</h1>
        <p class="text-xs text-yellow-200">Es Potong Singapore Kak Nun</p>
    </header>

    <main class="max-w-md mx-auto p-4 w-full flex-grow">
        <div class="bg-white p-5 rounded-3xl shadow-xl border border-red-100 space-y-4">
            <h2 class="text-sm font-extrabold text-red-800 border-b pb-2">Scan QR HP Pelanggan</h2>

            <div class="space-y-2">
                <div id="reader" class="w-full overflow-hidden rounded-2xl border border-slate-200"></div>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-slate-400 text-[10px]">ATAU INPUT MANUAL ID</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="manualId" placeholder="Contoh: KN-123456" class="flex-grow text-xs border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-red-600">
                <button onclick="addManualStamp()" class="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-4 py-2 rounded-xl">Tambah</button>
            </div>

            <div id="scanStatus" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>
        </div>
    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400">
        &copy; 2026 Es Potong Singapore Kak Nun
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfcz3Ip67jzue1N4w6At0PeEWUzCx034A",
            authDomain: "esptgkaknun.firebaseapp.com",
            projectId: "esptgkaknun",
            storageBucket: "esptgkaknun.firebasestorage.app",
            messagingSenderId: "666344356351",
            appId: "1:666344356351:web:5c00ffeb1e972dd9440fca"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let html5QrCode = null;

        window.onload = function() {
            startScanner();
        };

        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 180, height: 180 } },
                (scannedText) => {
                    let cleanId = scannedText.trim();
                    if (cleanId.includes('KN-')) {
                        let match = cleanId.match(/KN-\d+/);
                        if (match) cleanId = match[0];
                    }
                    processStamp(cleanId);
                },
                (err) => {}
            ).catch(err => console.log(err));
        }

        function addManualStamp() {
            let val = document.getElementById('manualId').value.trim();
            if(val) {
                processStamp(val);
                document.getElementById('manualId').value = '';
            }
        }

        async function processStamp(targetId) {
            let statusBox = document.getElementById('scanStatus');
            statusBox.classList.remove('hidden');
            statusBox.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-xs font-bold text-center";
            statusBox.innerText = `⏳ Memproses stempel untuk ${targetId}...`;

            try {
                let userRef = db.collection('customers').doc(targetId);
                let doc = await userRef.get();

                if (doc.exists) {
                    let currentStamps = doc.data().stamps;
                    if (currentStamps < 10) {
                        await userRef.update({ stamps: currentStamps + 1 });
                        statusBox.className = "bg-emerald-100 text-emerald-800 p-3 rounded-xl text-xs font-bold text-center";
                        statusBox.innerText = `✅ Berhasil! Stempel ${targetId} bertambah jadi ${currentStamps + 1}/10`;
                    } else {
                        statusBox.className = "bg-amber-100 text-amber-800 p-3 rounded-xl text-xs font-bold text-center";
                        statusBox.innerText = `⚠️ Kartu ${targetId} sudah PENUH (10/10)! Siap ditukar es gratis.`;
                    }
                } else {
                    await userRef.set({
                        id: targetId,
                        stamps: 1,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    statusBox.className = "bg-emerald-100 text-emerald-800 p-3 rounded-xl text-xs font-bold text-center";
                    statusBox.innerText = `✅ Pelanggan baru ${targetId} terdaftar! Stempel 1/10`;
                }
            } catch (e) {
                statusBox.className = "bg-red-100 text-red-800 p-3 rounded-xl text-xs font-bold text-center";
                statusBox.innerText = `❌ Gagal terhubung ke database. Coba lagi!`;
            }
        }
    </script>
</body>
</html>
