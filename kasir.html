<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - Es Potong Singapore Kak Nun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-red-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-red-700 text-white p-4 shadow-md text-center border-b-4 border-yellow-400">
        <h1 class="text-xl font-extrabold tracking-wider">🔒 PANEL KASIR</h1>
        <p class="text-xs text-yellow-200">Es Potong Singapore Kak Nun</p>
    </header>

    <main class="max-w-md mx-auto p-4 w-full flex-grow space-y-4">
        <div class="bg-white p-5 rounded-3xl shadow-xl border border-red-100 space-y-4">
            <h2 class="text-sm font-extrabold text-red-800 border-b pb-2">Scan QR Nama Pelanggan</h2>

            <div class="space-y-2">
                <div id="reader" class="w-full overflow-hidden rounded-2xl border border-slate-200"></div>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-slate-400 text-[10px]">ATAU KETIK NAMA MANUAL</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="manualId" placeholder="Contoh: Budi" class="flex-grow text-xs border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-red-600">
                <button onclick="addManualStamp()" class="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-4 py-2 rounded-xl">Tambah</button>
            </div>

            <div id="scanStatus" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>
        </div>

        <!-- Panel khusus klaim/reset jika kartu penuh -->
        <div id="rewardPanel" class="hidden bg-amber-50 border-2 border-amber-400 p-5 rounded-3xl shadow-lg space-y-3 text-center">
            <span class="bg-amber-400 text-amber-950 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Status: Kartu Penuh (10/10)</span>
            <h3 id="targetIdText" class="text-sm font-bold text-slate-700">Pelanggan: -</h3>
            <p class="text-xs text-amber-900">Pelanggan berhak mendapat <span class="font-bold">1 Es Potong Gratis</span>!</p>
            <button onclick="resetCard()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl shadow-md transition">
                🎉 Klaim Hadiah & Reset Kartu ke 0
            </button>
        </div>
    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400">
        &copy; 2026 Es Potong Singapore Kak Nun
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfcz3Ip67jzue1N4w6At0PeEWUzCx034A",
            authDomain: "esptgkaknun.firebaseapp.com",
            projectId: "esptgkaknun",
            storageBucket: "esptgkaknun.firebasestorage.app",
            messagingSenderId: "666344356351",
            appId: "1:666344356351:web:5c00ffeb1e972dd9440fca"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let html5QrCode = null;
        let isProcessing = false;
        let activeCustomerName = null;

        window.onload = function() {
            startScanner();
        };

        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 180, height: 180 } },
                (scannedText) => {
                    if (isProcessing) return;
                    let cleanName = scannedText.trim();
                    if (cleanName) {
                        processStamp(cleanName);
                    }
                },
                (err) => {}
            ).catch(err => console.log(err));
        }

        function addManualStamp() {
            if (isProcessing) return;
            let val = document.getElementById('manualId').value.trim();
            if(val) {
                processStamp(val);
                document.getElementById('manualId').value = '';
            }
        }

        async function processStamp(targetName) {
            isProcessing = true;
            activeCustomerName = targetName;
            let statusBox = document.getElementById('scanStatus');
            let rewardPanel = document.getElementById('rewardPanel');
            
            rewardPanel.classList.add('hidden');
            statusBox.classList.remove('hidden');
            statusBox.className = "bg-blue-100 text-blue-800 p-3 rounded-xl text-xs font-bold text-center";
            statusBox.innerText = `⏳ Memproses stempel untuk ${targetName}...`;

            try {
                let userRef = db.collection('customers').doc(targetName);
                let doc = await userRef.get();

                if (doc.exists) {
                    let currentStamps = doc.data().stamps;
                    if (currentStamps < 10) {
                        await userRef.update({ stamps: currentStamps + 1 });
                        statusBox.className = "bg-emerald-100 text-emerald-800 p-3 rounded-xl text-xs font-bold text-center";
                        statusBox.innerText = `✅ Berhasil! Stempel ${targetName} bertambah jadi ${currentStamps + 1}/10`;
                    } else {
                        statusBox.classList.add('hidden');
                        document.getElementById('targetIdText').innerText = `Pelanggan: ${targetName}`;
                        rewardPanel.classList.remove('hidden');
                    }
                } else {
                    await userRef.set({
                        id: targetName,
                        stamps: 1,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    statusBox.className = "bg-emerald-100 text-emerald-800 p-3 rounded-xl text-xs font-bold text-center";
                    statusBox.innerText = `✅ Pelanggan baru "${targetName}" terdaftar! Stempel 1/10`;
                }
            } catch (e) {
                statusBox.className = "bg-red-100 text-red-800 p-3 rounded-xl text-xs font-bold text-center";
                statusBox.innerText = `❌ Gagal terhubung ke database. Coba lagi!`;
            }

            // Cooldown 5 detik
            setTimeout(() => {
                isProcessing = false;
            }, 5000);
        }

        async function resetCard() {
            if (!activeCustomerName) return;
            
            let rewardPanel = document.getElementById('rewardPanel');
            let statusBox = document.getElementById('scanStatus');

            try {
                let userRef = db.collection('customers').doc(activeCustomerName);
                await userRef.update({ stamps: 0 });

                rewardPanel.classList.add('hidden');
                statusBox.classList.remove('hidden');
                statusBox.className = "bg-emerald-100 text-emerald-800 p-3 rounded-xl text-xs font-bold text-center";
                statusBox.innerText = `🎁 Hadiah diklaim! Kartu ${activeCustomerName} di-reset ke 0.`;
                
                activeCustomerName = null;
            } catch (e) {
                alert("Gagal mereset kartu. Coba lagi!");
            }
        }
    </script>
</body>
</html>
