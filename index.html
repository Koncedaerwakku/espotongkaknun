<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kak Nun - Kartu Stempel Es Potong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .stempel-icon {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-red-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-red-700 text-white p-4 shadow-md text-center border-b-4 border-yellow-400">
        <h1 class="text-xl font-extrabold tracking-wider">🍦 KAK NUN</h1>
        <p class="text-xs text-yellow-200">Es Potong Singapore - Loyalty Card</p>
    </header>

    <main class="max-w-md mx-auto p-4 w-full flex-grow">
        <div class="bg-white p-5 rounded-3xl shadow-xl border border-red-100 text-center space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="text-left">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">ID Pelanggan</span>
                    <h3 id="custIdDisplay" class="text-sm font-mono font-bold text-red-700">MEMUAT...</h3>
                </div>
                <span id="stampBadge" class="bg-yellow-400 text-red-900 text-xs font-extrabold px-3 py-1 rounded-full">0 / 10 Stempel</span>
            </div>

            <div id="stampGrid" class="grid grid-cols-5 gap-2 py-2"></div>

            <div class="bg-red-50 p-4 rounded-2xl border border-dashed border-red-300">
                <p class="text-xs font-bold text-red-800 mb-2">Scan QR ini di Kasir untuk Tambah Stempel</p>
                <div id="qrcode" class="flex justify-center bg-white p-2 rounded-xl inline-block shadow-sm"></div>
            </div>

            <div id="rewardBanner" class="hidden bg-gradient-to-r from-yellow-400 to-amber-500 text-red-950 p-3 rounded-2xl font-extrabold text-xs shadow-lg animate-bounce">
                🎉 GRATIS 1 ES POTONG SINGAPORE!<br>
                <span class="font-normal text-[11px]">Tunjukkan ke Kasir Kak Nun untuk klaim!</span>
            </div>
        </div>
        <p class="text-center text-[11px] text-slate-400 mt-4">Beli 10 Es Potong, Gratis 1 Pilihan Rasa Bebas!</p>
    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400">
        &copy; 2026 Es Potong Singapore Kak Nun
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfcz3Ip67jzue1N4w6At0PeEWUzCx034A",
            authDomain: "esptgkaknun.firebaseapp.com",
            projectId: "esptgkaknun",
            storageBucket: "esptgkaknun.firebasestorage.app",
            messagingSenderId: "666344356351",
            appId: "1:666344356351:web:5c00ffeb1e972dd9440fca"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let custId = localStorage.getItem('kaknun_customer_id');

        window.onload = async function() {
            if (!custId) {
                custId = 'KN-' + Math.floor(100000 + Math.random() * 900000);
                localStorage.setItem('kaknun_customer_id', custId);

                try {
                    await db.collection('customers').doc(custId).set({
                        id: custId,
                        stamps: 1,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (e) {
                    console.log("Gagal buat akun:", e);
                }
            }

            db.collection('customers').doc(custId).onSnapshot((doc) => {
                if (doc.exists) {
                    renderCard(doc.data());
                } else {
                    db.collection('customers').doc(custId).set({
                        id: custId,
                        stamps: 1,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            });
        };

        function renderCard(data) {
            document.getElementById('custIdDisplay').innerText = data.id;
            document.getElementById('stampBadge').innerText = `${data.stamps} / 10 Stempel`;

            const grid = document.getElementById('stampGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                let isStamped = i <= data.stamps;
                let div = document.createElement('div');
                div.className = `aspect-square rounded-2xl flex items-center justify-center font-extrabold text-xs border transition ${
                    isStamped 
                    ? 'bg-red-600 border-red-700 shadow-md scale-105' 
                    : 'bg-red-50 text-red-200 border-red-200 border-dashed'
                }`;
                div.innerHTML = isStamped ? '<img src="stamp-uncle-fang.png" alt="Stempel" class="stempel-icon">' : i;
                grid.appendChild(div);
            }

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: data.id,
                width: 130,
                height: 130
            });

            let rewardBanner = document.getElementById('rewardBanner');
            if (data.stamps >= 10) {
                rewardBanner.classList.remove('hidden');
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else {
                rewardBanner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
